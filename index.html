<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Her World ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="desktop">

        <!-- TOP BAR -->
        <div class="topbar">

            <div class="brand">
                ❤️ Her World
                <span>— just for you</span>
            </div>

            <div class="top-right">
                <span>♡</span>
                <span id="date">Loading...</span>
                <span id="top-clock">00:00</span>
            </div>

        </div>


        <!-- WELCOME -->
        <div class="welcome">

            <h1>Her World</h1>

            <p>
                A little corner of the internet made just for you ❤️
            </p>

        </div>


        <!-- APPS -->
        <div class="apps">

            <div class="app" onclick="openApp('quiz')">
                <div class="icon">🧠</div>
                <span>Know Me</span>
            </div>

            <div class="app" onclick="openApp('game')">
                <div class="icon">🎮</div>
                <span>Adventure</span>
            </div>

            <div class="app" onclick="openApp('messages')">
                <div class="icon">💌</div>
                <span>Messages</span>
            </div>

            <div class="app" onclick="openApp('gallery')">
                <div class="icon">📸</div>
                <span>Memories</span>
            </div>

            <div class="app" onclick="openApp('secret')">
                <div class="icon">🔐</div>
                <span>Secret</span>
            </div>

            <div class="app" onclick="openApp('trash')">
                <div class="icon">🗑️</div>
                <span>Trash</span>
            </div>

        </div>


        <!-- APP WINDOW -->
        <div id="window" class="window">

            <div class="window-header">

                <span id="window-title">
                    App
                </span>

                <button onclick="closeApp()">
                    ✕
                </button>

            </div>

            <div id="window-content" class="window-content">
            </div>

        </div>


        <!-- DOCK -->
        <div class="taskbar">

            <div
                class="start"
                onclick="closeApp()"
                title="Home"
            >
                ❤️
            </div>

            <div id="clock">
                00:00
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
